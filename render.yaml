services:
  - type: web
    name: pokebos
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/pokebos
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SOLANA_SECRET_KEY
        sync: false
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
